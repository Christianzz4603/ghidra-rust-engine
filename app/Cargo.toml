[package]
name = "reverse-pp-app"
description = "Reverse++ native cross-platform app (pure Rust, egui)"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# Standalone workspace: building the engine does not build the GUI and vice versa.
[workspace]

[dependencies]
# No `lumina` (HTTP/TLS client): keeps the dependency tree pure Rust.
ghidra-decompiler = { path = "..", default-features = false, features = ["demangle", "all-processors"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[profile.release]
opt-level = 3
lto = "thin"
