name: Build native libraries

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/build-libraries.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: Linux-x86_64
          - target: aarch64-unknown-linux-gnu
            name: Linux-Arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build all-processor library
        run: cross build --release --lib --target ${{ matrix.target }} --no-default-features --features all-processors
      - name: Package library
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libghidra_decompiler.so dist/libghidra-rust-engine-${{ matrix.name }}.so
          cp target/${{ matrix.target }}/release/libghidra_decompiler.a dist/libghidra-rust-engine-${{ matrix.name }}.a
          cp target/${{ matrix.target }}/release/libghidra_decompiler.rlib dist/libghidra-rust-engine-${{ matrix.name }}.rlib
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-rust-engine-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            linker: armv7a-linux-androideabi24-clang
          - target: aarch64-linux-android
            abi: arm64-v8a
            linker: aarch64-linux-android24-clang
          - target: i686-linux-android
            abi: x86
            linker: i686-linux-android24-clang
          - target: x86_64-linux-android
            abi: x86_64
            linker: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Android Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build Android native library
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')_LINKER=$TOOLCHAIN/${{ matrix.linker }}" >> "$GITHUB_ENV"
          cargo build --release --lib --target "${{ matrix.target }}" --no-default-features --features all-processors
      - name: Package Android library
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libghidra_decompiler.so dist/libghidra-rust-engine-Android-${{ matrix.abi }}.so
          cp target/${{ matrix.target }}/release/libghidra_decompiler.a dist/libghidra-rust-engine-Android-${{ matrix.abi }}.a
          cp target/${{ matrix.target }}/release/libghidra_decompiler.rlib dist/libghidra-rust-engine-Android-${{ matrix.abi }}.rlib
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-rust-engine-Android-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows library
        run: cargo build --release --lib --target x86_64-pc-windows-msvc --no-default-features --features all-processors
      - name: Package Windows library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ghidra_decompiler.dll dist/ghidra-rust-engine-Windows-x64.dll
          Copy-Item target/x86_64-pc-windows-msvc/release/ghidra_decompiler.lib dist/ghidra-rust-engine-Windows-x64.lib
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-rust-engine-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: macOS-x86_64
          - target: aarch64-apple-darwin
            name: macOS-Arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Install macOS Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build macOS library
        run: cargo build --release --lib --target ${{ matrix.target }} --no-default-features --features all-processors
      - name: Package macOS library
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libghidra_decompiler.dylib dist/libghidra-rust-engine-${{ matrix.name }}.dylib
          cp target/${{ matrix.target }}/release/libghidra_decompiler.a dist/libghidra-rust-engine-${{ matrix.name }}.a
          cp target/${{ matrix.target }}/release/libghidra_decompiler.rlib dist/libghidra-rust-engine-${{ matrix.name }}.rlib
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-rust-engine-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish release assets
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
      - linux
      - android
      - windows
      - macos
    runs-on: ubuntu-24.04
    steps:
      - name: Download all platform libraries
        uses: actions/download-artifact@v4
        with:
          pattern: ghidra-rust-engine-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Attach libraries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
