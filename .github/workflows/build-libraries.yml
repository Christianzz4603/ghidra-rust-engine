name: Build native libraries

# Builds the shared (.so/.dll/.dylib), static (.a/.lib) and Rust (.rlib) libraries
# for every supported platform.
#
# Releases are published only from this workflow, and only when ALL platform
# builds succeed:
#   * pushing a tag `vX.Y.Z` (must match the version in Cargo.toml), or
#   * a push to master whose Cargo.toml version has no GitHub Release yet, or
#   * running this workflow manually with the `tag` input from master or a tag.
# An existing release that already has assets is never overwritten. Releases are
# created with the built-in GITHUB_TOKEN, which GitHub does not use to trigger
# further workflow runs, so publishing a release cannot start a loop.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "include/**"
      - "ci/package-native.sh"
      - ".github/workflows/build-libraries.yml"
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v2.1.0 (leave empty to only build and keep artifacts)"
        required: false
        type: string

concurrency:
  group: native-libraries-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_FEATURES: all-processors,demangle

jobs:
  prepare:
    name: Decide release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::could not read the package version from Cargo.toml"
            exit 1
          fi

          tag=""
          publish=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            publish=true
          elif [ "$EVENT" = push ]; then
            tag="v${version}"
            publish=true
          elif [ "$EVENT" = workflow_dispatch ] && [ -n "$INPUT_TAG" ]; then
            if [ "$REF_TYPE" != tag ] && [ "$REF_NAME" != master ]; then
              echo "::error::releases can only be published from master or a tag, not from '$REF_NAME'"
              exit 1
            fi
            tag="$INPUT_TAG"
            publish=true
          fi

          if [ "$publish" = true ]; then
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
              echo "::error::'$tag' is not a valid release tag (expected vMAJOR.MINOR.PATCH)"
              exit 1
            fi
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::tag '$tag' does not match the Cargo.toml version '$version'"
              exit 1
            fi
            if release_json="$(gh release view "$tag" --json assets 2>/dev/null)"; then
              existing="$(jq '.assets | length' <<<"$release_json")"
              if [ "$existing" -gt 0 ]; then
                echo "::notice::Release $tag already exists with $existing assets; not publishing again"
                publish=false
              fi
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT tag='$tag' publish=$publish"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: github.event_name != 'push' || needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, kind: linux }
          - { name: Linux-Arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, kind: linux }
          - { name: Android-Arm64, os: ubuntu-24.04, target: aarch64-linux-android, kind: android }
          - { name: Windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc, kind: windows }
          - { name: macOS-x86_64, os: macos-15, target: x86_64-apple-darwin, kind: macos }
          - { name: macOS-Arm64, os: macos-15, target: aarch64-apple-darwin, kind: macos }
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain, so install exactly that one and add
      # the cross target to it. (Installing a different toolchain with an action
      # does not help: rustup would still pick the pinned one inside the repo and
      # report that the target is not installed.)
      - name: Install Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version --verbose

      - name: Configure Android NDK linker
        if: matrix.kind == 'android'
        shell: bash
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            echo "::error::no Android NDK found on this runner (ANDROID_NDK_LATEST_HOME / ANDROID_NDK_ROOT)"
            exit 1
          fi
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build library
        shell: bash
        run: >
          cargo build --release --locked --lib
          --target "${{ matrix.target }}"
          --no-default-features --features "$CARGO_FEATURES"

      - name: Package library
        shell: bash
        run: bash ./ci/package-native.sh "${{ matrix.target }}" "${{ matrix.name }}" "${{ matrix.kind }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download every platform build
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true

      - name: Verify all platforms are present and write SHA256SUMS
        working-directory: release-assets
        run: |
          set -euo pipefail
          for platform in Linux-x86_64 Linux-Arm64 Android-Arm64 Windows-x86_64 macOS-x86_64 macOS-Arm64; do
            if ! ls ghidra-rust-engine-"${platform}".* >/dev/null 2>&1; then
              echo "::error::no library files for ${platform} were downloaded"
              exit 1
            fi
          done
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release, or attach to an empty one
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            assets="$(gh release view "$TAG" --json assets --jq '.assets | length')"
            if [ "$assets" -gt 0 ]; then
              echo "::error::release $TAG already has $assets assets; refusing to overwrite"
              exit 1
            fi
            gh release upload "$TAG" release-assets/*
          else
            flags=(--title "$TAG" --generate-notes --target "$GITHUB_SHA")
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" release-assets/* "${flags[@]}"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
