name: Autofix (temporary)

on:
  push:
    branches: [fix/clippy-lints]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Patch and report
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          perl -0pi -e 's/    if requested_name\.is_empty\(\) \{\n        return Err\(IfaceError::Parse\("Usage: decompile <function>"\.to_string\(\)\)\);\n    \}\n\n//' src/ifacedecomp/printing.rs
          cargo fmt
          git add -A -- src tests examples
          git commit -m "Allow 'decompile' with no argument (regression from usage hints commit)" && git push
          {
            echo "== diff stat =="
            git show --stat --format=%h HEAD | tail -5
            echo "== Usage: lines added by 2effb59 =="
            git show 2effb59 -- src | grep -n '^[+-].*Usage:' | cut -c1-200 | head -60
            echo "== clippy =="
            cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | grep -E "^(src|tests|examples).*(error|warning)|could not compile|Finished" | head -20
            echo "== datatests summary =="
            cargo test --test datatests 2>&1 | grep -E "^Total:|^test result|^FAIL" | cut -c1-220 | head -40
            echo "== datatests parse errors =="
            DATATESTS_CONSOLE=1 cargo test --test datatests -- --nocapture 2>&1 | grep -E "Command parsing error|Function ERROR|^Error:" | sed 's#/home/runner[^ ]*##' | sort | uniq -c | sort -rn | head -20
            echo "== lib tests =="
            cargo test --lib 2>&1 | grep -E "^test result|FAILED|failed" | head -10
          } > autofix-report.txt 2>&1
          git add -f autofix-report.txt
          git commit -m "Update autofix report (temporary)"
          git push
