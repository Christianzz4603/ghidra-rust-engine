name: Autofix (temporary)

on:
  push:
    branches: [fix/clippy-lints]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Patch remaining lints
        run: |
          sed -i 's/^use crate::comment::{Comment, CommentDatabase};$/use crate::comment::Comment;/' src/program.rs
          sed -i '/^use crate::globalcontext::ContextDatabase;$/d' src/program.rs
          sed -i -E '/^\s*let mut decompile_ok = 0usize;$/d; /^\s*decompile_ok \+= 1;$/d' src/ifacedecomp/printing.rs
          if ! grep -q -B1 '^fn smali_type(' src/dex.rs || ! grep -B1 '^fn smali_type(' src/dex.rs | grep -q 'cfg(test)'; then
            sed -i 's/^fn smali_type(/#[cfg(test)]\nfn smali_type(/' src/dex.rs
          fi
          git diff --stat

      - name: Apply rustfmt
        continue-on-error: true
        run: cargo fmt

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src tests examples
          if ! git diff --cached --quiet; then
            git commit -m "Fix remaining clippy errors"
            git push
          fi

      - name: Write report
        continue-on-error: true
        run: |
          {
            echo "== CLIPPY REMAINING =="
            cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | grep -E "^(src|tests|examples).*(error|warning)|could not compile|Finished" | head -60
            echo "== DATATESTS.RS =="
            sed -n '60,200p' tests/datatests.rs
            echo "== new_test_console =="
            grep -n 'fn new_test_console' -A30 src/testfunction.rs | head -60
            echo "== DATATEST (boolless) =="
            RUST_BACKTRACE=1 DATATESTS_FILTER=boolless cargo test --test datatests -- --nocapture 2>&1 | grep -v "^   Compiling" | cut -c1-300 | head -40
            echo "== LAST GOOD RUST CI? =="
            git log --oneline -15
          } > autofix-report.txt 2>&1
          git add -f autofix-report.txt
          git commit -m "Update autofix report (temporary)" || true
          git push
