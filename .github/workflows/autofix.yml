name: Autofix (temporary)

on:
  push:
    branches: [fix/clippy-lints]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Patch and report
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! grep -q 'allow(dead_code)' examples/webui.rs; then
            sed -i 's/^fn main() {$/#[allow(dead_code)]\nfn main() {/' examples/webui.rs
          fi
          cargo fmt
          git add -A -- src tests examples
          git commit -m "Allow dead_code on webui example main (it is included as a module by another example)" && git push
          {
            echo "== CLIPPY REMAINING =="
            cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | grep -E "^(src|tests|examples).*(error|warning)|could not compile|Finished" | head -30
            echo "== grep Usage: decompile =="
            grep -rn 'Usage: decompile' src | head
            F=$(grep -rln 'Usage: decompile' src | head -1)
            L=$(grep -n 'Usage: decompile' "$F" | head -1 | cut -d: -f1)
            echo "file=$F line=$L"
            sed -n "$((L-30)),$((L+15))p" "$F"
            echo "== git log -S =="
            git log --format='%h %ad %s' --date=short -S'Usage: decompile <function>' -- src | head
            echo "== boolless.xml =="
            head -c 1500 tests/data/datatests/boolless.xml | cut -c1-200
          } > autofix-report.txt 2>&1
          git add -f autofix-report.txt
          git commit -m "Update autofix report (temporary)"
          git push
