name: Autofix (temporary)

on:
  push:
    branches: [fix/clippy-lints]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Write report
        run: |
          set +e
          {
            echo "== CLIPPY REMAINING =="
            cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | grep -E "^(src|tests|examples).*(error|warning)|could not compile|Finished" | head -30
            echo "== Cargo.toml (example/bin sections) =="
            grep -n -A6 '^\[\[' Cargo.toml
            ls examples
            echo "== webui.rs =="
            grep -n 'cfg\|fn main\|^mod \|^use ' examples/webui.rs | head -40
            sed -n '325,345p' examples/webui.rs
            echo "== DATATEST (boolless, console) =="
            DATATESTS_CONSOLE=1 DATATESTS_FILTER=boolless cargo test --test datatests -- --nocapture 2>&1 | grep -v "^   Compiling" | cut -c1-400 | head -80
            echo "== git log =="
            git log --oneline -8
          } > autofix-report.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f autofix-report.txt
          git commit -m "Update autofix report (temporary)"
          git push
