name: Rust CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Run library tests
        run: cargo test --lib
      - name: Build decompiler CLI
        run: cargo build --release --example decomp
