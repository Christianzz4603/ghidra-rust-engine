name: Rust CI

on:
  push:
    branches:
      - master
      - hex-rays-style-decompiler
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Run library tests
        run: cargo test --lib
      - name: Build all-processor decompiler CLI
        run: cargo build --release --example decomp --features all-processors
      - name: Build persistent Ghidra host worker
        run: cargo build --release --bin ghidra-rust-worker
      - name: Check ARM-focused mobile build
        run: cargo check --no-default-features --features mobile --examples
