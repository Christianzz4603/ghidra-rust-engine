name: Rust CI

on:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Run library tests
        run: cargo test --lib
      - name: Build decompiler CLI
        run: cargo build --release --example decomp
      - name: Check ARM-focused mobile build
        run: cargo check --no-default-features --features mobile --examples
