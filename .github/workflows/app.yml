name: App

# Builds the native Reverse++ app (pure Rust, egui) on all three desktop platforms.
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Build
        run: cargo build --release --manifest-path app/Cargo.toml
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: reverse-pp-app-${{ matrix.os }}
          path: |
            app/target/release/reverse-pp-app
            app/target/release/reverse-pp-app.exe
          if-no-files-found: warn
