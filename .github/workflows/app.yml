name: App

# Builds the native Reverse++ app (pure Rust, egui) on all three desktop platforms.
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Build
        run: cargo build --release --manifest-path app/Cargo.toml
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: reverse-pp-app-${{ matrix.os }}
          path: |
            app/target/release/reverse-pp-app
            app/target/release/reverse-pp-app.exe
          if-no-files-found: warn

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and the Android target
        run: |
          rustup show
          rustup target add aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the native library (arm64-v8a)
        working-directory: app
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -o jniLibs build --release --lib
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: reverse-pp-app-android-arm64-v8a
          path: app/jniLibs
          if-no-files-found: error
